[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mlxsmith"
version = "0.1.4"
description = "Apple Silicon MLX fine-tuning toolkit — SFT, DPO/ORPO, GRPO, distillation, and OpenAI-compatible serving."
readme = {file = "README.md", content-type = "text/markdown"}
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name="Shannon Labs", email="hmbown@gmail.com"}]
keywords = ["mlx", "apple-silicon", "llm", "fine-tuning", "lora", "openai-compatible"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Operating System :: MacOS :: MacOS X",
]
dependencies = [
  "typer>=0.9.0",
  "rich>=13.7.0",
  "pyyaml>=6.0.1",
  "pydantic>=2.5.0",
  "pydantic-settings>=2.2.1",
  "tomli>=2.0.1; python_version < '3.11'",
  "huggingface_hub>=1.3.4",
  "jsonschema>=4.21.0",
]

[project.urls]
Homepage = "https://github.com/Hmbown/MLXSmith"
Repository = "https://github.com/Hmbown/MLXSmith"
Issues = "https://github.com/Hmbown/MLXSmith/issues"

[project.optional-dependencies]
mlx = ["mlx>=0.30.4"]
llm = [
  "mlx-lm>=0.30.5",
  "transformers>=5.0.0",
  "datasets>=3.0.0",
]
serve = [
  "fastapi>=0.128.0",
  "uvicorn>=0.40.0",
  "httpx>=0.28.0",
]
dev = ["pytest>=9.0.0", "ruff>=0.14.0"]
all = [
  "mlx>=0.30.4",
  "mlx-lm>=0.30.5",
  "transformers>=5.0.0",
  "datasets>=3.0.0",
  "fastapi>=0.128.0",
  "uvicorn>=0.40.0",
  "httpx>=0.28.0",
]

[project.scripts]
mlxsmith = "mlxsmith.cli:app"

[tool.setuptools]
package-dir = {"" = "src"}
license-files = ["LICENSE"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
filterwarnings = [
  "ignore:Failed to load config file:UserWarning:mlxsmith.config",
]
